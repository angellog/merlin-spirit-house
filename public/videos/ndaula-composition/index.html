<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professor Ndaula Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: black; }
        [data-composition-id] { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div data-composition-id="ndaula-intro" data-width="360" data-height="640" data-duration="31.83" data-start="0">
        <!-- Original Video (Muted) -->
        <video id="v1" src="../prof-ndaula-intro.mp4" data-start="0" data-duration="31.83" data-track-index="0" muted playsinline></video>

        <!-- Original Audio -->
        <audio id="a1" src="../prof-ndaula-intro.mp3" data-start="0" data-duration="31.83" data-track-index="1" data-volume="1"></audio>

        <!-- New Name Audio -->
        <audio id="a2" src="../ndaula-name.mp3" data-start="4.87" data-duration="1.43" data-track-index="2" data-volume="1"></audio>

        <script>
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            // Duck the original audio during the name replacement
            tl.set("#a1", { attr: { "data-volume": 1 } }, 0);
            tl.to("#a1", { attr: { "data-volume": 0 }, duration: 0.1 }, 4.77);
            tl.to("#a1", { attr: { "data-volume": 1 }, duration: 0.1 }, 6.3);

            window.__timelines["ndaula-intro"] = tl;
        </script>
    </div>
</body>
</html>
